<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style type="text/css">
    .player {
      display: flex;
      flex-direction: column;
      width: 800px;
      height: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,1);
    }
    .js-play-button, .js-pause-button, .js-volume-button, .js-mute-button, .js-fullscreen-button {
      font-size: 15pt;
      color: white;
      border: white;
      cursor: pointer;
      background-color: transparent;
      width: 40px;
      height: 40px;
    }
    .js-fullscreen-button--flex {
      margin-left: auto;
    }

    .js-video-container {
      display: flex;
      flex-grow: 1;
    }
    .buttons-background {
      background-color: black;
      box-shadow: 0 0 10px rgba(0,0,0,1);
      display: flex;
      gap: 10px;
      align-items: center;
    }

  </style>
</head>
<body>
  <div class="player" id="player">
    <div class="js-video-container"></div>
    <div class="buttons-background" >
      <button class="js-play-button" type="button" aria-label="Play">
        <i class="fa fa-play" aria-hidden="true"></i>
      </button>
      <button class="js-pause-button" type="button" aria-label="Pause">
        <i class="fa fa-pause" aria-hidden="true"></i>
      </button>
      <button class="js-volume-button" type="button" aria-label="Volume">
        <i class="fa fa-volume-off" aria-hidden="true"></i>
      </button>
      <button class="js-mute-button" type="button" aria-label="Mute">
        <i class="fa fa-volume-up" aria-hidden="true"></i>
      </button>
      <button class="js-fullscreen-button js-fullscreen-button--flex" type="button" aria-label="Fullscreen">
        <i class="fa fa-expand" aria-hidden="true"></i>
      </button> 
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="static/player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>

</body>
</html>
