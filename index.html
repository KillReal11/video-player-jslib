<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style type="text/css">
    .player {
      width: 800px;
      height: 600px;
    }
    .js-play-button, .js-pause-button {
      color: white;
      border: white;
      cursor: pointer;
      background-color: transparent;
      width: 30px;
      height: 30px;
    }
    .js-video-container {
      width: 100%;
      height: 100%;
    }
    .buttons-background {
      background-color:black;
    }

  </style>
</head>
<body>
  <div class="player" id="player">
    <div class="js-video-container"></div>
    <div class="buttons-background" >
      <button class="js-play-button" type="button" aria-label="Play">
        <i class="fa fa-play" aria-hidden="true"></i>
      </button>
      <button class="js-pause-button" type="button" aria-label="Pause">
        <i class="fa fa-pause" aria-hidden="true"></i>
      </button>
    </div>
    <!-- Here can be placed player controls: play and volume buttons -->
  </div>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="static/player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>

</body>
</html>
