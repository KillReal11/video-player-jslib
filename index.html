<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="static/videopleer_icon.png">
  <link rel="stylesheet" href="static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="player" id="player">
    <div class="video-container js-video-container"></div>
    <div class="buttons-background">
      <div class="buttons-left">
        <button class="control-button js-play-button" type="button" aria-label="Play">
          <i class="fa fa-play" aria-hidden="true"></i>
        </button>
        <button class="control-button js-pause-button" type="button" aria-label="Pause">
          <i class="fa fa-pause" aria-hidden="true"></i>
        </button>
        <button class="control-button js-volume-button" type="button" aria-label="Volume">
          <i class="fa fa-volume-off" aria-hidden="true"></i>
        </button>
        <button class="control-button js-mute-button" type="button" aria-label="Mute">
          <i class="fa fa-volume-up" aria-hidden="true"></i>
        </button>
      </div>
      <div class="viewing-panel">
        <div class="timer-display">
          <span class="js-current-time"></span>
        </div>
        <div class="viewing-progressbar js-progress">
          <div class="progress-slider js-progress-slider"></div>
            <span class="slider-dot"></span>
        </div>
        <div class="timer-display">
          <span class="js-duration"></span>
        </div>
      </div>
      <div class="buttons-right">
        <button class="control-button control-button--fullscreen js-fullscreen-button" type="button" aria-label="Fullscreen">
          <i class="fa fa-expand" aria-hidden="true"></i>
        </button> 
      </div>

    </div>
    
  </div>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="static/player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>

</body>
</html>
